[build-system]
requires = ["setuptools>=61.0", "versioningit~=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openadmet-models"
description = "A short description of the project (less than one line)."
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "OpenADMET Contributors", email = "hugo.macdermott-opeskin@omsf.io" }
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]

requires-python = ">=3.11"

dependencies = [
  "ase~=3.26.0",
  "boto3~=1.40.0",
  "catboost~=1.2.0",
  "chemprop~=2.2.0",
  "datamol~=0.12.0",
  "email-validator",
  "hyperopt~=0.2.7",
  "ipython~=9.7.0",
  "intake~=2.0.0",
  "intake-parquet",
  "jinja2~=3.1.0",
  "joblib~=1.5.0",
  "lightgbm~=4.6.0",
  "lightning~=2.5.0",
  "loguru~=0.7.0",
  "matplotlib~=3.10.0",
  "matplotlib-inline~=0.2.0",
  "mdanalysis~=2.10.0",
  "mordredcommunity",
  "netCDF4~=1.7.0",
  "numpy~=2.3.0",
  "optuna~=4.6.0",
  "optuna-integration[sklearn]~=4.6.0",
  "pandas~=2.3.0",
  "phx-class-registry",
  "pingouin",
  "pydantic~=2.12.0",
  "pytorch-lightning~=2.5.0",
  "rdkit~=2025.9.0",
  "reportlab~=4.4.0",
  "rich~=14.2.0",
  "scikit-learn~=1.6.0",
  "seaborn~=0.13.0",
  "splito~=0.1.0",
  "statsmodels~=0.14.0",
  "tabulate~=0.9.0",
  "torch~=2.9.0",
  "torch-cluster~=1.6.0",
  "torch-geometric~=2.7.0",
  "torch-scatter~=2.1.0",
  "torch-sparse~=0.6.0",
  "tqdm",
  "umap-learn",
  "uncertainty-toolbox~=0.1.0",
  "wandb~=0.23.0",
  "xgboost~=3.1.0",
  "zarr~=3.1.0",
  "molfeat @ git+https://github.com/OpenADMET/molfeat.git@main",
  "mtenn @ git+https://github.com/OpenADMET/mtenn.git@main",
  "nepare @ git+https://github.com/JacksonBurns/neural-pairwise-regression.git",
  "tabpfn @ git+https://github.com/PriorLabs/TabPFN.git@main",
  "tabpfn-extensions",
  "useful-rdkit-utils @ git+https://github.com/PatWalters/useful_rdkit_utils.git@master",
]

[project.urls]
"Source" = "https://github.com/OpenADMET/openadmet-models"
"Documentation" = "https://openadmet-models.readthedocs.io/en/latest/?badge=latest"

[project.optional-dependencies]
test = [
  "pytest>=6.1.2",
  "pytest-cov",
  "pytest-xdist",
  "codecov",
]

[project.scripts]
openadmet = "openadmet.models.cli.cli:cli"

[tool.setuptools]
zip-safe = false
include-package-data = true
license-files = [ "LICENSE" ]

[tool.setuptools.packages.find]
namespaces = true
where = ["."]

[tool.setuptools.package-data]
"openadmet.models.tests.unit.test_data" = ["**"]
"openadmet.models.tests.integration.test_data" = ["**"]

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["*"]
default-tag = "0.0.0"

[tool.versioningit.write]
file = "openadmet/models/_version.py"

[tool.ruff.lint]
select = ["D", "D213", "D101"]
ignore = ["D212"]

[tool.ruff.per-file-ignores]
"**/__init__.py" = ["D104"] # Ignore D104 (Missing docstring in public package) specifically for __init__.py files
"**/tests/**.py" = ["D"] # Ignore all D and S101 (Use of assert detected) and S311 (Standard pseudo-random generators are not suitable for security/cryptographic purposes) and D103 (Missing docstring in public function) specifically for test files
